name: CI

on:
  push:
    branches: [ develop ]
  pull_request:

# google-services.json está gitignoreado, y el plugin de Google Services genera recursos por
# variante: sin el archivo de debug ni siquiera los tests JVM compilan, porque desde que
# habilitamos unitTests.isIncludeAndroidResources para Robolectric consumen recursos mergeados.

jobs:
  unit:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin este archivo el plugin de Google Services aborta con "Malformed root json", que no
      # dice nada sobre la causa real. Mejor fallar acá con el motivo.
      - name: Write google-services.json (debug)
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}" ]; then
            echo "::error::Falta el secret GOOGLE_SERVICES_JSON_DEBUG (base64 del google-services.json de debug, paquete dev.pcha.foodsense.app.dev)."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}" | base64 -d > app/google-services.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El emulador de Firestore es un jar y firebase-tools exige Java 21 o superior.
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - run: npm ci
        working-directory: firebase

      # emulators:exec levanta el emulador, corre vitest y lo baja, propagando el exit code.
      - run: npm test
        working-directory: firebase

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin este archivo el plugin de Google Services aborta con "Malformed root json", que no
      # dice nada sobre la causa real. Mejor fallar acá con el motivo.
      - name: Write google-services.json (debug)
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}" ]; then
            echo "::error::Falta el secret GOOGLE_SERVICES_JSON_DEBUG (base64 del google-services.json de debug, paquete dev.pcha.foodsense.app.dev)."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}" | base64 -d > app/google-services.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # El build service FirebaseEmulators invoca `npx firebase`, que resuelve al binario de
      # firebase/node_modules. Sin este install npx intentaría bajarlo del registry.
      - run: npm ci
        working-directory: firebase

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Los emuladores de Firestore y Auth los levanta y baja el build service de
      # app/build.gradle.kts, así que acá sólo hace falta el emulador de Android.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/firebase-emulators.log
