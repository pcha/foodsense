name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Puerta de entrada: si algo de esto falla, no se publica nada.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin este archivo el plugin de Google Services aborta con "Malformed root json", que no
      # dice nada sobre la causa real. Mejor fallar acá con el motivo.
      - name: Write google-services.json (debug)
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}" ]; then
            echo "::error::Falta el secret GOOGLE_SERVICES_JSON_DEBUG (base64 del google-services.json de debug, paquete dev.pcha.foodsense.app.dev)."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}" | base64 -d > app/google-services.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - run: npm ci
        working-directory: firebase

      - run: npm test
        working-directory: firebase

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog and Version
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-count: 0
          version-file: ./.version.yml
          skip-on-empty: false

      - name: Set up JDK 21
        if: steps.changelog.outputs.skipped == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changelog.outputs.skipped == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json (release)
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          mkdir -p app/src/release
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/src/release/google-services.json

      # ── Firma ───────────────────────────────────────────────────────────────
      # Sin estos secrets el APK sale sin firmar y no se puede instalar. Crearlos:
      #   keytool -genkey -v -keystore foodsense.jks -alias foodsense \
      #     -keyalg RSA -keysize 2048 -validity 10000
      #   base64 -i foodsense.jks
      # y cargar KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD.
      # ────────────────────────────────────────────────────────────────────────
      - name: Check signing secrets
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Falta KEYSTORE_BASE64. Sin keystore el APK sale sin firmar y no se instala."
            exit 1
          fi

      - name: Write keystore
        if: steps.changelog.outputs.skipped == 'false'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: steps.changelog.outputs.skipped == 'false'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.changelog.outputs.version }} \
            -PversionCode=${{ github.run_number }}

      # Si la firma no se aplicó, Gradle deja app-release-unsigned.apk y el release publicaría un
      # artefacto que no se instala — como pasaba hasta v0.8.1. Mejor fallar acá.
      - name: Verify the APK is signed
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No se generó $APK; el build quedó sin firmar."; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release
        if: steps.changelog.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          files: app/build/outputs/apk/release/app-release.apk

# Publicación en Play Store: los pasos estaban acá y se sacaron a propósito. Para retomarlos,
# recuperarlos del historial (git log -- .github/workflows/release.yml) y tener en cuenta que
# apuntaban a dos rutas que no existen: mapping.txt, que no se genera con isMinifyEnabled = false,
# y fastlane/metadata/android/en-US/changelogs.
