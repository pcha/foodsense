name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write google-services.json (release)
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::Falta el secret GOOGLE_SERVICES_JSON (base64 del google-services.json de release, paquete dev.pcha.foodsense.app)."
            exit 1
          fi
          mkdir -p app/src/release
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/src/release/google-services.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:testReleaseUnitTest :app:lintRelease

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog and Version
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-count: 0
          version-file: ./.version.yml
          skip-on-empty: false

      - name: Set up JDK 21
        if: steps.changelog.outputs.skipped == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changelog.outputs.skipped == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json (release)
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          mkdir -p app/src/release
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/src/release/google-services.json

      - name: Check signing secrets
        if: steps.changelog.outputs.skipped == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Falta KEYSTORE_BASE64."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Falta KEYSTORE_PASSWORD."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Falta KEY_ALIAS."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Falta KEY_PASSWORD."; exit 1; }

      - name: Write keystore
        if: steps.changelog.outputs.skipped == 'false'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: steps.changelog.outputs.skipped == 'false'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.changelog.outputs.version }} \
            -PversionCode=${{ github.run_number }}

      - name: Verify the APK is signed
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No se generó $APK; el build quedó sin firmar."; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release
        if: steps.changelog.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          files: app/build/outputs/apk/release/app-release.apk
